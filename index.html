<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sporturi Live</title>

<style>
* {
    box-sizing: border-box;
}

:root {
    --text: #101828;
    --muted: #667085;
    --blue: #1570ef;
    --green: #12b76a;
    --panel: rgba(255,255,255,.82);
    --line: rgba(16,24,40,.08);
    --shadow: 0 24px 70px rgba(16,24,40,.12);
}

html,
body {
    margin: 0;
    min-height: 100%;
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    color: var(--text);
    background:
        radial-gradient(circle at 8% 10%, rgba(21,112,239,.24), transparent 28%),
        radial-gradient(circle at 88% 18%, rgba(18,183,106,.22), transparent 28%),
        radial-gradient(circle at 50% 95%, rgba(255,193,7,.18), transparent 32%),
        linear-gradient(135deg, #eef6ff 0%, #f8fbff 45%, #ecfff7 100%);
    background-attachment: fixed;
}

body {
    padding: 26px 12px 70px;
}

.page {
    width: min(1180px, 100%);
    margin: 0 auto;
}

.header {
    background: var(--panel);
    backdrop-filter: blur(18px);
    border: 1px solid rgba(255,255,255,.65);
    border-radius: 28px;
    box-shadow: var(--shadow);
    padding: 28px 32px;
    margin-bottom: 22px;
}

.header h1 {
    margin: 0;
    font-size: clamp(34px, 5vw, 64px);
    letter-spacing: -2px;
    line-height: .95;
}

.header p {
    margin: 12px 0 0;
    color: var(--muted);
    font-size: 17px;
}

.events {
    display: grid;
    gap: 14px;
}

.event-card {
    background: rgba(255,255,255,.86);
    backdrop-filter: blur(18px);
    border: 1px solid rgba(255,255,255,.72);
    border-radius: 24px;
    box-shadow: 0 18px 44px rgba(16,24,40,.10);
    overflow: hidden;
}

.event-main {
    display: grid;
    grid-template-columns: 170px 130px 1fr;
    gap: 18px;
    align-items: center;
    padding: 20px 22px;
    cursor: pointer;
    transition: .2s ease;
}

.event-main:hover {
    background: rgba(21,112,239,.075);
}

.info-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    width: fit-content;
    padding: 10px 14px;
    border-radius: 999px;
    background: #eff6ff;
    color: var(--blue);
    font-weight: 900;
    white-space: nowrap;
}

.time-pill {
    background: #ecfdf3;
    color: var(--green);
}

.event-content {
    min-width: 0;
}

.event-line {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
    font-size: 22px;
    font-weight: 950;
}

.flag {
    width: 30px;
    height: 30px;
    object-fit: contain;
    border-radius: 8px;
    background: rgba(16,24,40,.04);
    padding: 2px;
}

.vs {
    font-size: 14px;
    color: var(--muted);
    font-weight: 900;
    text-transform: uppercase;
}

.competition {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-top: 8px;
    color: var(--muted);
    font-size: 15px;
    font-weight: 700;
}

.competition-logo {
    width: 24px;
    height: 24px;
    object-fit: contain;
}

.sources-row {
    display: none;
    border-top: 1px solid var(--line);
    background: rgba(248,250,252,.72);
    padding: 16px 22px 20px;
}

.event-card.active .sources-row {
    display: block;
}

.sources-title {
    margin-bottom: 12px;
    color: var(--muted);
    font-weight: 900;
    font-size: 14px;
}

.sources {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

.source-btn {
    border: 0;
    cursor: pointer;
    padding: 10px 15px;
    border-radius: 12px;
    background: linear-gradient(135deg, #1570ef, #004eeb);
    color: white;
    font-size: 14px;
    font-weight: 900;
    box-shadow: 0 10px 24px rgba(21,112,239,.22);
}

.source-btn:hover {
    transform: translateY(-1px);
}

.loading,
.error {
    background: rgba(255,255,255,.86);
    border-radius: 22px;
    padding: 35px;
    text-align: center;
    color: var(--muted);
}

.modal {
    position: fixed;
    inset: 0;
    z-index: 99999;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(15,23,42,.72);
    backdrop-filter: blur(12px);
    padding: 16px;
}

.modal.active {
    display: flex;
}

.modal-box {
    width: min(760px, 100%);
    background: #fff;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 30px 90px rgba(0,0,0,.38);
}

.modal-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 14px;
    padding: 13px 15px;
    background: #f8fafc;
    border-bottom: 1px solid #e5e7eb;
}

.modal-title {
    font-size: 14px;
    font-weight: 900;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.close-btn {
    border: 0;
    background: #12b76a;
    color: #fff;
    border-radius: 10px;
    padding: 8px 12px;
    font-weight: 900;
    cursor: pointer;
}

.player {
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
}

.player iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
}

@media(max-width: 760px) {
    body {
        padding: 14px 8px 50px;
    }

    .header {
        padding: 22px;
        border-radius: 22px;
    }

    .event-main {
        grid-template-columns: 1fr;
        gap: 12px;
        padding: 17px;
    }

    .event-line {
        font-size: 19px;
        flex-wrap: wrap;
    }

    .sources-row {
        padding: 15px 17px 18px;
    }

    .source-btn {
        width: 100%;
    }
}
</style>
</head>

<body>

<div class="page">
    <header class="header">
        <h1>Sporturi Live</h1>
        <p>Apasă pe un eveniment pentru a vedea sursele video disponibile.</p>
    </header>

    <main id="events" class="events">
        <div class="loading">Se încarcă evenimentele...</div>
    </main>
</div>

<div class="modal" id="videoModal">
    <div class="modal-box">
        <div class="modal-top">
            <div class="modal-title" id="modalTitle">Player video</div>
            <button class="close-btn" type="button" onclick="closeModal()">Închide ✕</button>
        </div>
        <div class="player" id="modalPlayer"></div>
    </div>
</div>

<script>
const EVENTS_URL = "eventos.json";

const eventsBox = document.getElementById("events");
const modal = document.getElementById("videoModal");
const modalTitle = document.getElementById("modalTitle");
const modalPlayer = document.getElementById("modalPlayer");

let activeCard = null;

function text(value, fallback = "") {
    return value === undefined || value === null || value === "" ? fallback : String(value);
}

function attr(value) {
    return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll('"', "&quot;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
}

function img(src, alt, cls) {
    if (!src) return "";
    return `<img class="${cls}" src="${attr(src)}" alt="${attr(alt)}" loading="lazy" onerror="this.style.display='none'">`;
}

function getStreams(event) {
    if (Array.isArray(event.streams) && event.streams.length) return event.streams;
    if (event.link) return [{ name: event.channel || event.source || "Sursa video", url: event.link }];
    return [];
}

function renderEvent(event, index) {
    const date = text(event.date, "12 iunie 2026");
    const time = text(event.time, "--:--");

    const competition = text(event.competition || event.category, "Competiție");
    const competitionLogo = text(event.competition_logo);

    const title = text(event.title, "Eveniment fără titlu");

    const team1 = text(event.team1 || event.home_team || event.homeTeam, "");
    const team2 = text(event.team2 || event.away_team || event.awayTeam, "");

    const team1Logo = text(event.team1_logo || event.home_logo || event.homeLogo);
    const team2Logo = text(event.team2_logo || event.away_logo || event.awayLogo);

    const streams = getStreams(event);

    const eventTitle = team1 || team2
        ? `
            ${img(team1Logo, team1, "flag")}
            <span>${team1}</span>
            <span class="vs">vs</span>
            <span>${team2}</span>
            ${img(team2Logo, team2, "flag")}
          `
        : `<span>${title}</span>`;

    const buttons = streams.map((source, i) => {
        const name = text(source.name, `Sursa ${i + 1}`);
        const url = text(source.url || source.link, "#");

        return `
            <button class="source-btn" type="button" onclick="openModal(event, '${attr(url)}', '${attr(title)} — ${attr(name)}')">
                ${name}
            </button>
        `;
    }).join("");

    return `
        <article class="event-card">
            <div class="event-main" onclick="toggleCard(this.parentElement)">
                <div class="info-pill">📅 ${date}</div>
                <div class="info-pill time-pill">⏰ ${time}</div>

                <div class="event-content">
                    <div class="event-line">${eventTitle}</div>

                    <div class="competition">
                        ${img(competitionLogo, competition, "competition-logo")}
                        <span>${competition}</span>
                    </div>
                </div>
            </div>

            <div class="sources-row">
                <div class="sources-title">Surse video disponibile</div>
                <div class="sources">
                    ${buttons || "<span class='error'>Nu există surse video.</span>"}
                </div>
            </div>
        </article>
    `;
}

function toggleCard(card) {
    if (activeCard && activeCard !== card) {
        activeCard.classList.remove("active");
    }

    card.classList.toggle("active");
    activeCard = card.classList.contains("active") ? card : null;
}

function openModal(e, url, title) {
    e.stopPropagation();

    modalTitle.textContent = title;
    modalPlayer.innerHTML = `
        <iframe
            src="${url}"
            allowfullscreen
            webkitallowfullscreen
            mozallowfullscreen
            allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
            referrerpolicy="no-referrer">
        </iframe>
    `;

    modal.classList.add("active");
    document.body.style.overflow = "hidden";
}

function closeModal() {
    modal.classList.remove("active");
    modalPlayer.innerHTML = "";
    document.body.style.overflow = "";
}

modal.addEventListener("click", function(e) {
    if (e.target === modal) closeModal();
});

document.addEventListener("keydown", function(e) {
    if (e.key === "Escape") closeModal();
});

async function loadEvents() {
    try {
        const response = await fetch(EVENTS_URL, { cache: "no-store" });
        if (!response.ok) throw new Error();

        const events = await response.json();

        if (!Array.isArray(events) || !events.length) {
            eventsBox.innerHTML = `<div class="error">Nu există evenimente disponibile.</div>`;
            return;
        }

        eventsBox.innerHTML = events.map(renderEvent).join("");

    } catch {
        eventsBox.innerHTML = `
            <div class="error">
                Evenimentele nu au putut fi încărcate.<br>
                Verifică fișierul <strong>eventos.json</strong>.
            </div>
        `;
    }
}

loadEvents();
</script>

</body>
</html>
