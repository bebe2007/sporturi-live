<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sporturi Live</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background:
        radial-gradient(circle at top left, rgba(0, 255, 160, 0.16), transparent 32%),
        radial-gradient(circle at top right, rgba(229, 9, 20, 0.18), transparent 30%),
        #06070a;
    color: #fff;
    font-family: Arial, sans-serif;
}

body {
    padding: 28px 14px;
}

.page {
    max-width: 1200px;
    margin: 0 auto;
}

.header {
    text-align: center;
    margin-bottom: 34px;
}

.header h1 {
    margin: 0;
    font-size: clamp(34px, 5vw, 62px);
    letter-spacing: -1.5px;
}

.header p {
    margin: 12px 0 0;
    color: #b8beca;
    font-size: 17px;
}

.events {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 18px;
}

.card {
    position: relative;
    overflow: hidden;
    border-radius: 26px;
    padding: 22px;
    background:
        linear-gradient(145deg, rgba(255,255,255,0.12), rgba(255,255,255,0.045));
    border: 1px solid rgba(255,255,255,0.14);
    box-shadow:
        0 20px 60px rgba(0,0,0,0.35),
        inset 0 1px 0 rgba(255,255,255,0.10);
}

.card::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
        radial-gradient(circle at top left, rgba(255,255,255,0.12), transparent 35%),
        radial-gradient(circle at bottom right, rgba(0,255,160,0.10), transparent 34%);
    pointer-events: none;
}

.card-content {
    position: relative;
    z-index: 2;
}

.top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 14px;
    margin-bottom: 18px;
}

.competition {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
}

.logo-small {
    width: 34px;
    height: 34px;
    object-fit: contain;
    border-radius: 50%;
    background: rgba(255,255,255,0.10);
    padding: 4px;
}

.competition-name {
    color: #dfe5ef;
    font-size: 14px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.status {
    padding: 8px 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 900;
    letter-spacing: .3px;
    background: rgba(0,255,160,0.13);
    border: 1px solid rgba(0,255,160,0.28);
    color: #74ffc8;
    white-space: nowrap;
}

.match {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 18px;
    align-items: center;
    margin: 26px 0;
}

.team {
    text-align: center;
    min-width: 0;
}

.team-logo {
    width: 86px;
    height: 86px;
    object-fit: contain;
    border-radius: 24px;
    background: rgba(255,255,255,0.09);
    border: 1px solid rgba(255,255,255,0.12);
    padding: 12px;
    margin-bottom: 10px;
}

.team-name {
    font-size: 17px;
    font-weight: 900;
    line-height: 1.25;
}

.vs {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.time {
    font-size: 28px;
    font-weight: 950;
    letter-spacing: -0.8px;
}

.vs-text {
    margin-top: 4px;
    color: #9ca3af;
    font-weight: 800;
    font-size: 13px;
}

.title {
    font-size: 20px;
    font-weight: 950;
    line-height: 1.3;
    margin-bottom: 14px;
}

.info {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 18px;
}

.badge {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.10);
    color: #d9deea;
    padding: 7px 10px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
}

.streams {
    display: grid;
    gap: 10px;
}

.stream-btn {
    display: block;
    width: 100%;
    text-align: center;
    text-decoration: none;
    color: #fff;
    background: linear-gradient(135deg, #e50914, #ff3b45);
    padding: 13px 16px;
    border-radius: 16px;
    font-weight: 950;
    box-shadow: 0 14px 34px rgba(229,9,20,0.28);
}

.loading,
.error {
    text-align: center;
    color: #c7ccd7;
    padding: 60px 20px;
    font-size: 18px;
}

@media (max-width: 850px) {
    .events {
        grid-template-columns: 1fr;
    }

    body {
        padding: 20px 10px;
    }
}

@media (max-width: 520px) {
    .card {
        padding: 17px;
        border-radius: 22px;
    }

    .match {
        grid-template-columns: 1fr;
        gap: 12px;
    }

    .team-logo {
        width: 76px;
        height: 76px;
    }

    .time {
        font-size: 26px;
    }

    .top-row {
        align-items: flex-start;
        flex-direction: column;
    }
}
</style>
</head>

<body>

<div class="page">
    <header class="header">
        <h1>Sporturi Live</h1>
        <p>Evenimentele sunt afișate exact cum sunt scrise în fișierul <strong>eventos.json</strong>.</p>
    </header>

    <main id="events" class="events">
        <div class="loading">Se încarcă evenimentele...</div>
    </main>
</div>

<script>
const EVENTS_URL = "eventos.json";
const eventsContainer = document.getElementById("events");

function safeText(value, fallback = "") {
    return value === undefined || value === null || value === "" ? fallback : String(value);
}

function safeImage(src, alt, className) {
    if (!src) return "";
    return `<img class="${className}" src="${src}" alt="${alt}" loading="lazy" onerror="this.style.display='none'">`;
}

function normalizeStreams(event) {
    if (Array.isArray(event.streams) && event.streams.length > 0) {
        return event.streams;
    }

    if (event.link) {
        return [
            {
                name: event.channel || event.source || "Deschide transmisiunea",
                url: event.link
            }
        ];
    }

    return [];
}

function renderEvent(event) {
    const title = safeText(event.title, "Eveniment fără titlu");

    const competition = safeText(event.competition || event.category, "Competiție nespecificată");
    const competitionLogo = safeText(event.competition_logo || event.competitionLogo);

    const team1 = safeText(event.team1 || event.home_team || event.homeTeam, "");
    const team2 = safeText(event.team2 || event.away_team || event.awayTeam, "");

    const team1Logo = safeText(event.team1_logo || event.home_logo || event.homeLogo);
    const team2Logo = safeText(event.team2_logo || event.away_logo || event.awayLogo);

    const time = safeText(event.time, "--:--");
    const status = safeText(event.status, "Status necunoscut");
    const category = safeText(event.category, "");
    const language = safeText(event.language, "");

    const streams = normalizeStreams(event);

    const streamsHtml = streams.map((stream, index) => {
        const name = safeText(stream.name, `Sursa ${index + 1}`);
        const url = safeText(stream.url || stream.link, "#");

        return `
            <a class="stream-btn" href="${url}" target="_blank" rel="noopener noreferrer">
                ${name}
            </a>
        `;
    }).join("");

    return `
        <article class="card">
            <div class="card-content">

                <div class="top-row">
                    <div class="competition">
                        ${safeImage(competitionLogo, competition, "logo-small")}
                        <div class="competition-name">${competition}</div>
                    </div>

                    <div class="status">${status}</div>
                </div>

                <div class="match">
                    <div class="team">
                        ${safeImage(team1Logo, team1, "team-logo")}
                        <div class="team-name">${team1}</div>
                    </div>

                    <div class="vs">
                        <div class="time">${time}</div>
                        <div class="vs-text">VS</div>
                    </div>

                    <div class="team">
                        ${safeImage(team2Logo, team2, "team-logo")}
                        <div class="team-name">${team2}</div>
                    </div>
                </div>

                <div class="title">${title}</div>

                <div class="info">
                    ${category ? `<span class="badge">${category}</span>` : ""}
                    ${language ? `<span class="badge">${language}</span>` : ""}
                </div>

                <div class="streams">
                    ${streamsHtml || `<span class="badge">Nu există surse disponibile.</span>`}
                </div>

            </div>
        </article>
    `;
}

async function loadEvents() {
    try {
        const response = await fetch(EVENTS_URL, { cache: "no-store" });

        if (!response.ok) {
            throw new Error("Fișierul eventos.json nu a putut fi încărcat.");
        }

        const events = await response.json();

        if (!Array.isArray(events) || events.length === 0) {
            eventsContainer.innerHTML = `<div class="error">Nu există evenimente disponibile.</div>`;
            return;
        }

        eventsContainer.innerHTML = events.map(renderEvent).join("");

    } catch (error) {
        eventsContainer.innerHTML = `
            <div class="error">
                Evenimentele nu au putut fi încărcate.<br>
                Verifică dacă fișierul <strong>eventos.json</strong> există lângă <strong>index.html</strong>.
            </div>
        `;
    }
}

loadEvents();
</script>

</body>
</html>
