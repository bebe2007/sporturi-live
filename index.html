<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sporturi Live</title>

<style>
* {
    box-sizing: border-box;
}

:root {
    --bg: #f4f7fb;
    --panel: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --line: #e5e7eb;
    --blue: #007bff;
    --blue-dark: #0056b3;
    --green: #28a745;
    --green-dark: #218838;
    --shadow: 0 18px 45px rgba(15, 23, 42, .10);
}

html,
body {
    margin: 0;
    min-height: 100%;
    background:
        radial-gradient(circle at top left, rgba(0,123,255,.10), transparent 30%),
        radial-gradient(circle at bottom right, rgba(40,167,69,.10), transparent 28%),
        var(--bg);
    color: var(--text);
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
}

body {
    padding: 24px 12px 70px;
}

.page {
    width: min(1180px, 100%);
    margin: 0 auto;
}

.header {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: var(--shadow);
    padding: 24px;
    margin-bottom: 20px;
}

.header h1 {
    margin: 0;
    font-size: clamp(28px, 4vw, 46px);
    letter-spacing: -1px;
}

.header p {
    margin: 8px 0 0;
    color: var(--muted);
    font-size: 16px;
}

.table-container {
    width: 100%;
    background: var(--panel);
    border-radius: 18px;
    box-shadow: var(--shadow);
    border: 1px solid var(--line);
    overflow: hidden;
}

.table-head,
.event-row {
    display: grid;
    grid-template-columns: 70px 140px 110px 1.25fr 2fr 120px;
    align-items: center;
}

.table-head {
    background: #f9fafb;
    border-bottom: 1px solid var(--line);
    color: #374151;
    font-size: 13px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: .04em;
}

.th,
.td {
    padding: 16px;
}

.event-row {
    cursor: pointer;
    background: #ffffff;
    border-bottom: 1px solid var(--line);
    transition: background .2s ease, color .2s ease, transform .2s ease;
}

.event-row:hover {
    background: var(--blue);
    color: #ffffff;
}

.event-row:hover .muted,
.event-row:hover .competition-name {
    color: rgba(255,255,255,.88);
}

.icon {
    font-size: 24px;
}

.date {
    font-weight: 800;
}

.time {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 74px;
    padding: 8px 10px;
    border-radius: 999px;
    background: rgba(0,123,255,.10);
    color: var(--blue);
    font-weight: 900;
}

.event-row:hover .time {
    background: rgba(255,255,255,.20);
    color: #fff;
}

.logo-line,
.teams-line {
    display: flex;
    align-items: center;
    gap: 9px;
    min-width: 0;
}

.logo {
    width: 24px;
    height: 24px;
    object-fit: contain;
    flex: 0 0 auto;
}

.flag-logo {
    width: 28px;
    height: 28px;
    object-fit: contain;
    background: rgba(0,0,0,.03);
    border-radius: 8px;
    padding: 2px;
    flex: 0 0 auto;
}

.competition-name,
.event-title {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-weight: 800;
}

.event-title {
    color: inherit;
}

.muted {
    color: var(--muted);
    font-size: 13px;
    margin-top: 3px;
}

.live-pill {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--green);
    color: #fff;
    border-radius: 999px;
    padding: 8px 12px;
    font-size: 13px;
    font-weight: 900;
    white-space: nowrap;
}

.links-row {
    display: none;
    background: #eef4f9;
    border-bottom: 1px solid var(--line);
}

.links-row.active {
    display: block;
}

.links-inner {
    padding: 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

.source-btn {
    border: 0;
    cursor: pointer;
    padding: 9px 14px;
    border-radius: 8px;
    background: var(--blue);
    color: #ffffff;
    font-weight: 800;
    font-size: 14px;
    transition: background .2s ease, transform .2s ease;
}

.source-btn:hover {
    background: var(--blue-dark);
    transform: translateY(-1px);
}

.loading,
.error {
    padding: 40px 16px;
    text-align: center;
    color: var(--muted);
}

.modal {
    position: fixed;
    inset: 0;
    z-index: 99999;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(17,24,39,.74);
    padding: 16px;
}

.modal.active {
    display: flex;
}

.modal-box {
    width: min(760px, 100%);
    background: #ffffff;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 30px 90px rgba(0,0,0,.35);
}

.modal-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 14px;
    padding: 12px 14px;
    background: #f9fafb;
    border-bottom: 1px solid var(--line);
}

.modal-title {
    font-size: 14px;
    font-weight: 900;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.close-btn {
    border: 0;
    background: var(--green);
    color: #fff;
    border-radius: 8px;
    padding: 8px 12px;
    font-weight: 900;
    cursor: pointer;
}

.close-btn:hover {
    background: var(--green-dark);
}

.player {
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
}

.player iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
}

@media (max-width: 900px) {
    .table-head {
        display: none;
    }

    .event-row {
        grid-template-columns: 46px 1fr auto;
        grid-template-areas:
            "icon event live"
            "icon info info";
        gap: 8px;
        padding: 14px;
    }

    .event-row .td {
        padding: 0;
    }

    .td-icon {
        grid-area: icon;
    }

    .td-date,
    .td-time,
    .td-competition {
        display: none;
    }

    .td-event {
        grid-area: event;
    }

    .td-live {
        grid-area: live;
    }

    .event-title {
        white-space: normal;
        line-height: 1.35;
    }

    .mobile-info {
        display: block;
        grid-area: info;
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
    }

    .event-row:hover .mobile-info {
        color: rgba(255,255,255,.88);
    }

    .links-inner {
        padding: 14px;
    }

    .source-btn {
        width: 100%;
    }
}

@media (min-width: 901px) {
    .mobile-info {
        display: none;
    }
}
</style>
</head>

<body>

<div class="page">

    <header class="header">
        <h1>Sporturi Live</h1>
        <p>Evenimente sportive afișate din fișierul <strong>eventos.json</strong>. Apasă pe un eveniment pentru a vedea sursele video.</p>
    </header>

    <section class="table-container">
        <div class="table-head">
            <div class="th">#</div>
            <div class="th">Dată</div>
            <div class="th">Ora</div>
            <div class="th">Competiție</div>
            <div class="th">Eveniment</div>
            <div class="th">Live</div>
        </div>

        <div id="events">
            <div class="loading">Se încarcă evenimentele...</div>
        </div>
    </section>

</div>

<div class="modal" id="videoModal">
    <div class="modal-box">
        <div class="modal-top">
            <div class="modal-title" id="modalTitle">Player video</div>
            <button class="close-btn" type="button" onclick="closeModal()">Închide ✕</button>
        </div>
        <div class="player" id="modalPlayer"></div>
    </div>
</div>

<script>
const EVENTS_URL = "eventos.json";

const eventsBox = document.getElementById("events");
const modal = document.getElementById("videoModal");
const modalTitle = document.getElementById("modalTitle");
const modalPlayer = document.getElementById("modalPlayer");

let activeLinks = null;

function text(value, fallback = "") {
    return value === undefined || value === null || value === "" ? fallback : String(value);
}

function attr(value) {
    return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll('"', "&quot;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
}

function img(src, alt, className = "logo") {
    if (!src) return "";
    return `<img class="${className}" src="${attr(src)}" alt="${attr(alt)}" loading="lazy" onerror="this.style.display='none'">`;
}

function getStreams(event) {
    if (Array.isArray(event.streams) && event.streams.length) return event.streams;

    if (event.link) {
        return [{
            name: event.channel || event.source || "Sursa video",
            url: event.link
        }];
    }

    return [];
}

function renderEvent(event, index) {
    const eventId = `event-${index}`;

    const sportIcon = text(event.icon, "⚽");
    const date = text(event.date, "12 iunie 2026");
    const time = text(event.time, "--:--");

    const competition = text(event.competition || event.category, "Competiție");
    const competitionLogo = text(event.competition_logo);

    const title = text(event.title, "Eveniment fără titlu");

    const team1 = text(event.team1 || event.home_team || event.homeTeam, "");
    const team2 = text(event.team2 || event.away_team || event.awayTeam, "");

    const team1Logo = text(event.team1_logo || event.home_logo || event.homeLogo);
    const team2Logo = text(event.team2_logo || event.away_logo || event.awayLogo);

    const status = text(event.status, "Live");
    const language = text(event.language, "");

    const streams = getStreams(event);

    const sourceButtons = streams.map((source, i) => {
        const name = text(source.name, `Sursa ${i + 1}`);
        const url = text(source.url || source.link, "#");

        return `
            <button class="source-btn" type="button" onclick="openModal('${attr(url)}', '${attr(title)} — ${attr(name)}')">
                ${name}
            </button>
        `;
    }).join("");

    const teamsHtml = team1 || team2 ? `
        <div class="teams-line">
            ${img(team1Logo, team1, "flag-logo")}
            <span>${team1}</span>
            <strong>vs</strong>
            <span>${team2}</span>
            ${img(team2Logo, team2, "flag-logo")}
        </div>
    ` : title;

    return `
        <div class="event-row" onclick="toggleLinks('${eventId}')">
            <div class="td td-icon icon">${sportIcon}</div>

            <div class="td td-date date">${date}</div>

            <div class="td td-time">
                <span class="time">${time}</span>
            </div>

            <div class="td td-competition">
                <div class="logo-line">
                    ${img(competitionLogo, competition)}
                    <span class="competition-name">${competition}</span>
                </div>
            </div>

            <div class="td td-event">
                <div class="event-title">${teamsHtml}</div>
                <div class="muted">${title}${language ? " • " + language : ""}</div>
                <div class="mobile-info">
                    ${date} • ${time} • ${competition}
                </div>
            </div>

            <div class="td td-live">
                <span class="live-pill">${status}</span>
            </div>
        </div>

        <div class="links-row" id="${eventId}">
            <div class="links-inner">
                ${sourceButtons || "<span class='muted'>Nu există surse video disponibile.</span>"}
            </div>
        </div>
    `;
}

function toggleLinks(id) {
    const current = document.getElementById(id);

    if (activeLinks && activeLinks !== current) {
        activeLinks.classList.remove("active");
    }

    current.classList.toggle("active");
    activeLinks = current.classList.contains("active") ? current : null;
}

function openModal(url, title) {
    event.stopPropagation();

    modalTitle.textContent = title;
    modalPlayer.innerHTML = `
        <iframe
            src="${url}"
            allowfullscreen
            webkitallowfullscreen
            mozallowfullscreen
            allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
            referrerpolicy="no-referrer">
        </iframe>
    `;

    modal.classList.add("active");
    document.body.style.overflow = "hidden";
}

function closeModal() {
    modal.classList.remove("active");
    modalPlayer.innerHTML = "";
    document.body.style.overflow = "";
}

modal.addEventListener("click", function(e) {
    if (e.target === modal) closeModal();
});

document.addEventListener("keydown", function(e) {
    if (e.key === "Escape") closeModal();
});

async function loadEvents() {
    try {
        const response = await fetch(EVENTS_URL, { cache: "no-store" });

        if (!response.ok) throw new Error();

        const events = await response.json();

        if (!Array.isArray(events) || !events.length) {
            eventsBox.innerHTML = `<div class="error">Nu există evenimente disponibile.</div>`;
            return;
        }

        eventsBox.innerHTML = events.map(renderEvent).join("");

    } catch {
        eventsBox.innerHTML = `
            <div class="error">
                Evenimentele nu au putut fi încărcate.<br>
                Verifică dacă fișierul <strong>eventos.json</strong> există lângă <strong>index.html</strong>.
            </div>
        `;
    }
}

loadEvents();
</script>

</body>
</html>
