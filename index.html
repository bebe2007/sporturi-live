<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sporturi Live</title>

<style>
* {
    box-sizing: border-box;
}

:root {
    --bg: #05060a;
    --card: rgba(255,255,255,0.075);
    --card2: rgba(255,255,255,0.115);
    --border: rgba(255,255,255,0.13);
    --text: #ffffff;
    --muted: #aeb6c6;
    --accent: #00ff9d;
    --accent2: #e50914;
    --gold: #ffd166;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background:
        radial-gradient(circle at 10% 0%, rgba(0,255,157,.20), transparent 34%),
        radial-gradient(circle at 90% 5%, rgba(229,9,20,.20), transparent 32%),
        radial-gradient(circle at 50% 100%, rgba(77,118,255,.16), transparent 30%),
        var(--bg);
    color: var(--text);
    font-family: Arial, sans-serif;
}

body {
    padding: 30px 14px;
}

.page {
    max-width: 1240px;
    margin: 0 auto;
}

.header {
    text-align: center;
    margin-bottom: 36px;
}

.header-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 9px 14px;
    border-radius: 999px;
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.12);
    color: var(--muted);
    font-size: 13px;
    font-weight: 800;
    margin-bottom: 14px;
}

.header h1 {
    margin: 0;
    font-size: clamp(38px, 6vw, 76px);
    line-height: .94;
    letter-spacing: -3px;
}

.header p {
    max-width: 720px;
    margin: 16px auto 0;
    color: var(--muted);
    font-size: 17px;
    line-height: 1.6;
}

.events {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 22px;
}

.card {
    position: relative;
    overflow: hidden;
    border-radius: 30px;
    min-height: 390px;
    padding: 1px;
    cursor: pointer;
    background:
        linear-gradient(145deg, rgba(255,255,255,.24), rgba(255,255,255,.06), rgba(0,255,157,.18));
    box-shadow:
        0 30px 80px rgba(0,0,0,.42),
        inset 0 1px 0 rgba(255,255,255,.18);
    transition: transform .22s ease, box-shadow .22s ease;
}

.card:hover {
    transform: translateY(-6px);
    box-shadow:
        0 42px 100px rgba(0,0,0,.55),
        0 0 0 1px rgba(0,255,157,.18);
}

.card-inner {
    position: relative;
    height: 100%;
    border-radius: 29px;
    padding: 24px;
    overflow: hidden;
    background:
        linear-gradient(145deg, rgba(18,21,31,.92), rgba(9,10,15,.95)),
        rgba(255,255,255,.05);
}

.card-inner::before {
    content: "";
    position: absolute;
    inset: -80px -80px auto auto;
    width: 210px;
    height: 210px;
    background: radial-gradient(circle, rgba(0,255,157,.28), transparent 66%);
    pointer-events: none;
}

.card-inner::after {
    content: "";
    position: absolute;
    inset: auto auto -90px -90px;
    width: 240px;
    height: 240px;
    background: radial-gradient(circle, rgba(229,9,20,.22), transparent 68%);
    pointer-events: none;
}

.card-content {
    position: relative;
    z-index: 2;
}

.top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 14px;
    margin-bottom: 22px;
}

.competition {
    display: flex;
    align-items: center;
    gap: 11px;
    min-width: 0;
}

.logo-small {
    width: 42px;
    height: 42px;
    object-fit: contain;
    border-radius: 50%;
    background: rgba(255,255,255,.10);
    border: 1px solid rgba(255,255,255,.14);
    padding: 6px;
}

.competition-name {
    color: #eaf0f9;
    font-size: 14px;
    font-weight: 900;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.status {
    padding: 9px 13px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 950;
    letter-spacing: .3px;
    background: rgba(0,255,157,.13);
    border: 1px solid rgba(0,255,157,.32);
    color: #85ffd0;
    white-space: nowrap;
}

.match {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 18px;
    align-items: center;
    margin: 26px 0 20px;
}

.team {
    text-align: center;
    min-width: 0;
}

.team-logo-wrap {
    width: 96px;
    height: 96px;
    margin: 0 auto 12px;
    border-radius: 28px;
    display: grid;
    place-items: center;
    background:
        linear-gradient(145deg, rgba(255,255,255,.14), rgba(255,255,255,.055));
    border: 1px solid rgba(255,255,255,.14);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.18);
}

.team-logo {
    width: 76px;
    height: 76px;
    object-fit: contain;
    border-radius: 16px;
}

.team-name {
    font-size: 18px;
    font-weight: 950;
    line-height: 1.22;
}

.center-box {
    text-align: center;
}

.time {
    font-size: 34px;
    font-weight: 950;
    letter-spacing: -1px;
    color: #ffffff;
}

.vs-text {
    margin-top: 5px;
    color: var(--gold);
    font-weight: 950;
    font-size: 13px;
    letter-spacing: .18em;
}

.title {
    font-size: 21px;
    font-weight: 950;
    line-height: 1.32;
    margin: 16px 0;
}

.info {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 18px;
}

.badge {
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.11);
    color: #dce3ef;
    padding: 7px 10px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 800;
}

.open-hint {
    margin-top: 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    color: #dfe7f3;
    border-top: 1px solid rgba(255,255,255,.10);
    padding-top: 16px;
    font-size: 14px;
    font-weight: 900;
}

.open-hint span:last-child {
    color: var(--accent);
    font-size: 20px;
}

.sources-panel {
    display: none;
    position: relative;
    z-index: 3;
    margin-top: 18px;
    padding-top: 18px;
    border-top: 1px solid rgba(255,255,255,.12);
}

.card.active .sources-panel {
    display: grid;
    gap: 10px;
}

.stream-btn {
    width: 100%;
    border: 0;
    color: #fff;
    text-align: left;
    cursor: pointer;
    padding: 14px 15px;
    border-radius: 17px;
    font-weight: 950;
    background:
        linear-gradient(135deg, rgba(229,9,20,.95), rgba(255,59,69,.92));
    box-shadow: 0 16px 36px rgba(229,9,20,.26);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
}

.stream-btn small {
    opacity: .82;
    font-weight: 800;
}

.loading,
.error {
    grid-column: 1 / -1;
    text-align: center;
    color: #c7ccd7;
    padding: 60px 20px;
    font-size: 18px;
}

.modal {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: none;
    background: rgba(0,0,0,.86);
    backdrop-filter: blur(12px);
    padding: 20px;
}

.modal.active {
    display: flex;
    align-items: center;
    justify-content: center;
}

.modal-box {
    width: min(1180px, 100%);
    background: #05060a;
    border: 1px solid rgba(255,255,255,.16);
    border-radius: 26px;
    overflow: hidden;
    box-shadow: 0 40px 120px rgba(0,0,0,.74);
}

.modal-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    background: rgba(255,255,255,.07);
    border-bottom: 1px solid rgba(255,255,255,.10);
}

.modal-title {
    font-weight: 950;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.close-btn {
    border: 0;
    background: #ffffff;
    color: #000;
    padding: 9px 13px;
    border-radius: 999px;
    font-weight: 950;
    cursor: pointer;
}

.player-frame {
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
}

.player-frame iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
    background: #000;
}

@media (max-width: 900px) {
    .events {
        grid-template-columns: 1fr;
    }

    body {
        padding: 22px 10px;
    }
}

@media (max-width: 560px) {
    .header h1 {
        letter-spacing: -2px;
    }

    .card-inner {
        padding: 18px;
    }

    .match {
        grid-template-columns: 1fr;
        gap: 15px;
    }

    .team-logo-wrap {
        width: 84px;
        height: 84px;
    }

    .team-logo {
        width: 66px;
        height: 66px;
    }

    .time {
        font-size: 30px;
    }

    .top-row {
        align-items: flex-start;
        flex-direction: column;
    }

    .modal {
        padding: 8px;
    }

    .modal-box {
        border-radius: 18px;
    }
}
</style>
</head>

<body>

<div class="page">
    <header class="header">
        <div class="header-badge">⚽ evenimente live</div>
        <h1>Sporturi Live</h1>
        <p>Alege un eveniment, deschide sursele disponibile și urmărește transmisiunea direct în player.</p>
    </header>

    <main id="events" class="events">
        <div class="loading">Se încarcă evenimentele...</div>
    </main>
</div>

<div class="modal" id="videoModal">
    <div class="modal-box">
        <div class="modal-top">
            <div class="modal-title" id="modalTitle">Player video</div>
            <button class="close-btn" type="button" onclick="closeModal()">Închide ✕</button>
        </div>
        <div class="player-frame" id="modalPlayer"></div>
    </div>
</div>

<script>
const EVENTS_URL = "eventos.json";
const eventsContainer = document.getElementById("events");
const modal = document.getElementById("videoModal");
const modalTitle = document.getElementById("modalTitle");
const modalPlayer = document.getElementById("modalPlayer");

function safeText(value, fallback = "") {
    return value === undefined || value === null || value === "" ? fallback : String(value);
}

function safeAttr(value) {
    return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll('"', "&quot;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
}

function safeImage(src, alt, className) {
    if (!src) return "";

    return `
        <img
            class="${className}"
            src="${safeAttr(src)}"
            alt="${safeAttr(alt)}"
            loading="lazy"
            onerror="this.style.display='none'">
    `;
}

function normalizeStreams(event) {
    if (Array.isArray(event.streams) && event.streams.length > 0) {
        return event.streams;
    }

    if (event.link) {
        return [
            {
                name: event.channel || event.source || "Sursa video",
                url: event.link
            }
        ];
    }

    return [];
}

function renderEvent(event, eventIndex) {
    const title = safeText(event.title, "Eveniment fără titlu");

    const competition = safeText(event.competition || event.category, "Competiție nespecificată");
    const competitionLogo = safeText(event.competition_logo || event.competitionLogo);

    const team1 = safeText(event.team1 || event.home_team || event.homeTeam, "");
    const team2 = safeText(event.team2 || event.away_team || event.awayTeam, "");

    const team1Logo = safeText(event.team1_logo || event.home_logo || event.homeLogo);
    const team2Logo = safeText(event.team2_logo || event.away_logo || event.awayLogo);

    const time = safeText(event.time, "--:--");
    const status = safeText(event.status, "Status necunoscut");
    const category = safeText(event.category, "");
    const language = safeText(event.language, "");

    const streams = normalizeStreams(event);

    const streamsHtml = streams.map((stream, index) => {
        const name = safeText(stream.name, `Sursa ${index + 1}`);
        const url = safeText(stream.url || stream.link, "#");

        return `
            <button
                class="stream-btn"
                type="button"
                onclick="event.stopPropagation(); openModal('${safeAttr(url)}', '${safeAttr(title)} — ${safeAttr(name)}')">
                <span>${name}</span>
                <small>Deschide ▶</small>
            </button>
        `;
    }).join("");

    return `
        <article class="card" onclick="toggleSources(this)">
            <div class="card-inner">
                <div class="card-content">

                    <div class="top-row">
                        <div class="competition">
                            ${safeImage(competitionLogo, competition, "logo-small")}
                            <div class="competition-name">${competition}</div>
                        </div>

                        <div class="status">${status}</div>
                    </div>

                    <div class="match">
                        <div class="team">
                            <div class="team-logo-wrap">
                                ${safeImage(team1Logo, team1, "team-logo")}
                            </div>
                            <div class="team-name">${team1}</div>
                        </div>

                        <div class="center-box">
                            <div class="time">${time}</div>
                            <div class="vs-text">VS</div>
                        </div>

                        <div class="team">
                            <div class="team-logo-wrap">
                                ${safeImage(team2Logo, team2, "team-logo")}
                            </div>
                            <div class="team-name">${team2}</div>
                        </div>
                    </div>

                    <div class="title">${title}</div>

                    <div class="info">
                        ${category ? `<span class="badge">${category}</span>` : ""}
                        ${language ? `<span class="badge">${language}</span>` : ""}
                        <span class="badge">${streams.length} surse video</span>
                    </div>

                    <div class="open-hint">
                        <span>Apasă pe card pentru surse video</span>
                        <span>⌄</span>
                    </div>

                    <div class="sources-panel">
                        ${streamsHtml || `<span class="badge">Nu există surse disponibile.</span>`}
                    </div>

                </div>
            </div>
        </article>
    `;
}

function toggleSources(card) {
    document.querySelectorAll(".card").forEach(item => {
        if (item !== card) item.classList.remove("active");
    });

    card.classList.toggle("active");
}

function openModal(url, title) {
    modalTitle.textContent = title || "Player video";

    modalPlayer.innerHTML = `
        <iframe
            src="${url}"
            allowfullscreen
            webkitallowfullscreen
            mozallowfullscreen
            allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
            referrerpolicy="no-referrer">
        </iframe>
    `;

    modal.classList.add("active");
    document.body.style.overflow = "hidden";
}

function closeModal() {
    modal.classList.remove("active");
    modalPlayer.innerHTML = "";
    document.body.style.overflow = "";
}

modal.addEventListener("click", function(e) {
    if (e.target === modal) {
        closeModal();
    }
});

document.addEventListener("keydown", function(e) {
    if (e.key === "Escape") {
        closeModal();
    }
});

async function loadEvents() {
    try {
        const response = await fetch(EVENTS_URL, { cache: "no-store" });

        if (!response.ok) {
            throw new Error("Fișierul eventos.json nu a putut fi încărcat.");
        }

        const events = await response.json();

        if (!Array.isArray(events) || events.length === 0) {
            eventsContainer.innerHTML = `<div class="error">Nu există evenimente disponibile.</div>`;
            return;
        }

        eventsContainer.innerHTML = events.map(renderEvent).join("");

    } catch (error) {
        eventsContainer.innerHTML = `
            <div class="error">
                Evenimentele nu au putut fi încărcate.<br>
                Verifică dacă fișierul <strong>eventos.json</strong> există lângă <strong>index.html</strong>.
            </div>
        `;
    }
}

loadEvents();
</script>

</body>
</html>
