 <!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sporturi Live</title>

<style>
* {
    box-sizing: border-box;
}

:root {
    --bg: #07090f;
    --card: #111522;
    --card2: #151a2a;
    --border: rgba(255,255,255,.10);
    --text: #ffffff;
    --muted: #9aa4b7;
    --accent: #24e0a4;
    --danger: #ff3b45;
}

html,
body {
    margin: 0;
    min-height: 100%;
    background:
        radial-gradient(circle at top left, rgba(36,224,164,.16), transparent 30%),
        radial-gradient(circle at top right, rgba(255,59,69,.14), transparent 28%),
        var(--bg);
    color: var(--text);
    font-family: Arial, sans-serif;
}

body {
    padding: 24px 12px 60px;
}

.page {
    max-width: 980px;
    margin: 0 auto;
}

.header {
    margin-bottom: 26px;
}

.header h1 {
    margin: 0;
    font-size: clamp(32px, 6vw, 58px);
    letter-spacing: -2px;
}

.header p {
    margin: 10px 0 0;
    color: var(--muted);
    font-size: 16px;
}

.events {
    display: grid;
    gap: 14px;
}

.card {
    background: linear-gradient(145deg, var(--card), var(--card2));
    border: 1px solid var(--border);
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 18px 45px rgba(0,0,0,.30);
}

.card-main {
    display: grid;
    grid-template-columns: 150px 1fr 120px;
    gap: 18px;
    align-items: center;
    padding: 18px;
    cursor: pointer;
}

.competition {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--muted);
    font-size: 13px;
    font-weight: 800;
    margin-bottom: 10px;
}

.competition img {
    width: 28px;
    height: 28px;
    object-fit: contain;
}

.teams {
    display: flex;
    align-items: center;
    gap: 14px;
}

.team {
    display: flex;
    align-items: center;
    gap: 9px;
    min-width: 0;
}

.team img {
    width: 42px;
    height: 42px;
    object-fit: contain;
    background: rgba(255,255,255,.07);
    border-radius: 12px;
    padding: 5px;
}

.team span {
    font-size: 18px;
    font-weight: 900;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.vs {
    color: var(--muted);
    font-size: 12px;
    font-weight: 900;
}

.title {
    margin-top: 10px;
    color: #dfe5ef;
    font-size: 14px;
    line-height: 1.45;
}

.time-box {
    text-align: center;
}

.time {
    font-size: 30px;
    font-weight: 950;
    letter-spacing: -1px;
}

.status {
    display: inline-block;
    margin-top: 7px;
    padding: 6px 10px;
    border-radius: 999px;
    background: rgba(36,224,164,.12);
    color: var(--accent);
    border: 1px solid rgba(36,224,164,.22);
    font-size: 12px;
    font-weight: 900;
}

.action {
    text-align: right;
}

.open-btn {
    border: 0;
    border-radius: 999px;
    padding: 11px 15px;
    color: #06100c;
    background: var(--accent);
    font-weight: 950;
    cursor: pointer;
}

.sources {
    display: none;
    padding: 0 18px 18px;
}

.card.active .sources {
    display: block;
}

.sources-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    border-top: 1px solid var(--border);
    padding-top: 14px;
}

.source-btn {
    border: 1px solid rgba(255,255,255,.10);
    background: rgba(255,255,255,.06);
    color: #fff;
    border-radius: 14px;
    padding: 12px;
    font-weight: 900;
    cursor: pointer;
    text-align: center;
}

.source-btn:hover {
    background: rgba(36,224,164,.14);
    border-color: rgba(36,224,164,.30);
}

.modal {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: none;
    background: rgba(0,0,0,.78);
    backdrop-filter: blur(10px);
    padding: 16px;
}

.modal.active {
    display: flex;
    align-items: center;
    justify-content: center;
}

.modal-box {
    width: min(860px, 100%);
    background: #07090f;
    border: 1px solid rgba(255,255,255,.14);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 35px 100px rgba(0,0,0,.65);
}

.modal-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    background: #101522;
    border-bottom: 1px solid rgba(255,255,255,.10);
}

.modal-title {
    font-size: 14px;
    font-weight: 900;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.close-btn {
    border: 0;
    border-radius: 999px;
    background: #fff;
    color: #000;
    padding: 8px 12px;
    font-weight: 900;
    cursor: pointer;
}

.player {
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
}

.player iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
}

.loading,
.error {
    color: var(--muted);
    text-align: center;
    padding: 40px 15px;
}

@media(max-width: 760px) {
    .card-main {
        grid-template-columns: 1fr;
        gap: 14px;
    }

    .time-box,
    .action {
        text-align: left;
    }

    .teams {
        flex-wrap: wrap;
    }

    .sources-grid {
        grid-template-columns: 1fr;
    }

    .open-btn {
        width: 100%;
    }

    .modal-box {
        width: 100%;
    }
}
</style>
</head>

<body>

<div class="page">
    <header class="header">
        <h1>Sporturi Live</h1>
        <p>Alege un eveniment, vezi sursele disponibile și deschide playerul într-o fereastră modernă.</p>
    </header>

    <main id="events" class="events">
        <div class="loading">Se încarcă evenimentele...</div>
    </main>
</div>

<div class="modal" id="videoModal">
    <div class="modal-box">
        <div class="modal-top">
            <div class="modal-title" id="modalTitle">Player video</div>
            <button class="close-btn" onclick="closeModal()">Închide ✕</button>
        </div>

        <div class="player" id="modalPlayer"></div>
    </div>
</div>

<script>
const EVENTS_URL = "eventos.json";

const eventsContainer = document.getElementById("events");
const modal = document.getElementById("videoModal");
const modalTitle = document.getElementById("modalTitle");
const modalPlayer = document.getElementById("modalPlayer");

function txt(value, fallback = "") {
    return value === undefined || value === null || value === "" ? fallback : String(value);
}

function attr(value) {
    return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll('"', "&quot;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
}

function img(src, alt) {
    if (!src) return "";
    return `<img src="${attr(src)}" alt="${attr(alt)}" loading="lazy" onerror="this.style.display='none'">`;
}

function streams(event) {
    if (Array.isArray(event.streams) && event.streams.length) return event.streams;

    if (event.link) {
        return [{
            name: event.channel || event.source || "Sursa video",
            url: event.link
        }];
    }

    return [];
}

function renderEvent(event) {
    const title = txt(event.title, "Eveniment fără titlu");
    const competition = txt(event.competition || event.category, "Competiție");
    const competitionLogo = txt(event.competition_logo);

    const team1 = txt(event.team1 || event.home_team || event.homeTeam, "Echipa 1");
    const team2 = txt(event.team2 || event.away_team || event.awayTeam, "Echipa 2");

    const team1Logo = txt(event.team1_logo || event.home_logo || event.homeLogo);
    const team2Logo = txt(event.team2_logo || event.away_logo || event.awayLogo);

    const time = txt(event.time, "--:--");
    const status = txt(event.status, "Status");
    const list = streams(event);

    const sourceButtons = list.map((source, index) => {
        const name = txt(source.name, `Sursa ${index + 1}`);
        const url = txt(source.url || source.link, "#");

        return `
            <button class="source-btn" onclick="openModal('${attr(url)}', '${attr(title)} — ${attr(name)}')">
                ${name}
            </button>
        `;
    }).join("");

    return `
        <article class="card">
            <div class="card-main" onclick="toggleCard(this.parentElement)">
                <div>
                    <div class="competition">
                        ${img(competitionLogo, competition)}
                        <span>${competition}</span>
                    </div>

                    <div class="teams">
                        <div class="team">
                            ${img(team1Logo, team1)}
                            <span>${team1}</span>
                        </div>

                        <div class="vs">VS</div>

                        <div class="team">
                            ${img(team2Logo, team2)}
                            <span>${team2}</span>
                        </div>
                    </div>

                    <div class="title">${title}</div>
                </div>

                <div class="time-box">
                    <div class="time">${time}</div>
                    <div class="status">${status}</div>
                </div>

                <div class="action">
                    <button class="open-btn" type="button">Surse video</button>
                </div>
            </div>

            <div class="sources">
                <div class="sources-grid">
                    ${sourceButtons || "<div class='error'>Nu există surse video.</div>"}
                </div>
            </div>
        </article>
    `;
}

function toggleCard(card) {
    document.querySelectorAll(".card").forEach(item => {
        if (item !== card) item.classList.remove("active");
    });

    card.classList.toggle("active");
}

function openModal(url, title) {
    modalTitle.textContent = title;

    modalPlayer.innerHTML = `
        <iframe
            src="${url}"
            allowfullscreen
            webkitallowfullscreen
            mozallowfullscreen
            allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
            referrerpolicy="no-referrer">
        </iframe>
    `;

    modal.classList.add("active");
    document.body.style.overflow = "hidden";
}

function closeModal() {
    modal.classList.remove("active");
    modalPlayer.innerHTML = "";
    document.body.style.overflow = "";
}

modal.addEventListener("click", function(e) {
    if (e.target === modal) closeModal();
});

document.addEventListener("keydown", function(e) {
    if (e.key === "Escape") closeModal();
});

async function loadEvents() {
    try {
        const response = await fetch(EVENTS_URL, { cache: "no-store" });

        if (!response.ok) throw new Error();

        const events = await response.json();

        if (!Array.isArray(events) || !events.length) {
            eventsContainer.innerHTML = `<div class="error">Nu există evenimente disponibile.</div>`;
            return;
        }

        eventsContainer.innerHTML = events.map(renderEvent).join("");

    } catch {
        eventsContainer.innerHTML = `
            <div class="error">
                Evenimentele nu au putut fi încărcate.<br>
                Verifică fișierul <strong>eventos.json</strong>.
            </div>
        `;
    }
}

loadEvents();
</script>

</body>
</html>
