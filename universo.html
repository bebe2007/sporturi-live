<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>UNIVERSO USA</title>

<script src="//cdn.bitmovin.com/player/web/8/bitmovinplayer.js"></script>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
}

#playerdiv{
    width:100%;
    height:100vh;
}
</style>
</head>

<body>

<div id="playerdiv"></div>

<script>
function override(url){

    if (url.indexOf("licensing.bitmovin.com/licensing") > -1)
        return "data:text/plain;charset=utf-8;base64,eyJzdGF0dXMiOiJncmFudGVkIiwibWVzc2FnZSI6Ik9LIn0=";

    if (url.indexOf("licensing.bitmovin.com/impression") > -1)
        return "data:text/plain;charset=utf-8;base64,eyJzdGF0dXMiOiJncmFudGVkIiwibWVzc2FnZSI6Ik9LIn0=";

    return url;
}

var opens = XMLHttpRequest.prototype.open;

XMLHttpRequest.prototype.open = function () {
    arguments[1] = override(arguments[1]);
    return opens.apply(this, arguments);
};

var config = {
    key: "11d3698c-efdf-42f1-8769-54663995de2b",

    tweaks: {
        XHR_TIMEOUT: 10000
    },

    style: {
        width: "100%",
        height: "100vh"
    },

    playback: {
        autoplay: true,
        muted: true
    }
};

var source = {
    dash: "https://live-oneapp-prd-news.akamaized.net/Content/CMAF_OL2-CTR-4s/Live/channel(universo-east)/master.mpd",

    drm: {
        clearkey: [{
            key: "c618d32c56cdc6cad8330eb98507ca3f",
            kid: "96b67fa09140329a89b7a1ead134eda3"
        }]
    }
};

var player = new bitmovin.player.Player(
    document.getElementById("playerdiv"),
    config
);

player.load(source).then(function () {
    player.play();
});
</script>

</body>
</html>
