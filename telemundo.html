<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#000000" />
  <title>Telemundo</title>
  <link rel="icon" href="https://raw.githubusercontent.com/bebe2007/bebe2007.github.io/refs/heads/main/logo.png" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: manipulation;
      font-family: Arial, sans-serif;
    }
    #player {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }
    .loading {
      position: fixed;
      top: 40vh;
      width: 100%;
      text-align: center;
      color: white;
      font-size: 18px;
      z-index: 2;
    }
    .sound-tip {
      position: absolute;
      top: 10px;
      right: 12px;
      color: white;
      background: rgba(0, 0, 0, 0.6);
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 13px;
      z-index: 9999;
    }
    .watermark-text {
      position: fixed;
      bottom: 12px;
      right: 14px;
      color: white;
      font-size: 14px;
      opacity: 0.3;
      z-index: 9999;
      pointer-events: none;
      user-select: none;
    }
    .player-wrapper, .player, .media-control, .clappr-core {
      width: 100% !important;
      height: 100% !important;
    }
  </style>
</head>
<body>
  <div class="loading" id="loading">🔄 Se încarcă streamul...</div>
  <div id="player"></div>
  <div class="watermark-text">Bratu Marian</div>

  <script src="https://cdn.jsdelivr.net/npm/@clappr/player@0.4.0/dist/clappr.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/shaka-player@2.5.10/dist/shaka-player.compiled.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/clappr/dash-shaka-playback@latest/dist/dash-shaka-playback.external.min.js"></script>

  <script>
    document.addEventListener('contextmenu', e => e.preventDefault());

    const player = new Clappr.Player({
      source: "https://live-oneapp-prd-news.akamaized.net/Content/CMAF_OL2-CTR-4s/Live/channel(WNJU)/master.mpd",
      mimeType: "application/dash+xml",
      autoPlay: true,
      muted: true,
      plugins: [DashShakaPlayback],
      shakaConfiguration: {
        drm: {
          clearKeys: {
            '13223c98886ff43d3c5f271eeb457cc6': 'c71fe7bc82f037c6af21fd299d6341b0'
          }
        }
      },
      watermark: "https://raw.githubusercontent.com/bebe2007/bebe2007.github.io/refs/heads/main/logo.png",
      position: "top-left",
      watermarkLink: "https://google.ro/",
      width: "100%",
      height: "100%",
      parentId: "#player",
      events: {
        onReady: function () {
          document.getElementById('loading').style.display = 'none';

          setTimeout(() => {
            const logo = document.querySelector('.watermark[data-watermark]');
            if (logo) logo.style.opacity = '0.5';
          }, 500);

          const tip = document.createElement("div");
          tip.className = "sound-tip";
          tip.textContent = "🔊 Fă clic pentru sunet";
          document.querySelector("#player .player")?.appendChild(tip);
          setTimeout(() => tip.remove(), 3000);
        }
      }
    });
  </script>
</body>
</html>
